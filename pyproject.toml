[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-policy"
version = "0.1.0"
description = "GEAR-SONIC v1.1 (ONNX) sim2sim in MuJoCo with a latent-residual hook"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "onnxruntime",
    "mujoco",
    "pyyaml",
    "scipy",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest", "onnx", "joblib"]
torch = ["torch", "onnx"]          # decoder_backend="torch" (sonic/torch_decoder.py)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
